apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: enterprise-app-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/CloudSamraatC/argo-gitops-enterprise' # ArgoCD need point to repo
    targetRevision: HEAD
    path: envs/prod # Points ArgoCD to the Prod Kustomize overlay
  destination:
    server: 'https://default.svc'
    namespace: target-apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    createNamespace: true
