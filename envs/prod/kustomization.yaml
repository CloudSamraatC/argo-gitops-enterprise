apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Automatically changes resource names to "prod-python-web-app"
namePrefix: prod-

# Scale up to 3 replica copies for production traffic stability
patches:
  - target:
      kind: Deployment
      name: python-web-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
