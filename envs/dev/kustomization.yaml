
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Pull in the master templates from the base folder
resources:
  - ../../base

# Automatically changes resource names to "dev-python-web-app"
namePrefix: dev-

# Modifies settings specifically for developers
patches:
  - target:
      kind: Deployment
      name: python-web-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
